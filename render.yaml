services:
  # AeroVision Python FastAPI Backend & ML Prognostics Service (Render Free Tier)
  - type: web
    name: aerovision-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "https://hemanth2506.github.io,http://localhost:5173,http://127.0.0.1:5173"
      - key: HOST
        value: 0.0.0.0
